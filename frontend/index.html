<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FF6154">
  <title>Story Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="logo"></div>
      <span>Story Engine</span>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4-4.64 4.36A9 9 0 013.51 15"/>
      </svg>
    </button>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="add">Add Customer</button>
    <button class="tab" data-tab="customers">Customers</button>
    <button class="tab" data-tab="story">Story</button>
  </nav>

  <!-- ── Tab: Add Customer ─────────────────────────────────────────── -->
  <section class="pane active" id="tab-add">
    <div class="card">
      <h2 class="card-heading">Customer KPI Profile</h2>
      <form id="kpiForm" novalidate>

        <div class="field">
          <label class="label" for="customerName">Customer Name</label>
          <input id="customerName" class="input" type="text" placeholder="e.g. Acme Corp" autocomplete="off" required>
        </div>

        <div class="field">
          <label class="label" for="sector">Sector</label>
          <select id="sector" class="input select" required>
            <option value="">Select sector…</option>
          </select>
        </div>

        <div class="row2">
          <div class="field">
            <label class="label" for="companySize">Size</label>
            <select id="companySize" class="input select">
              <option value="">Any</option>
              <option value="startup">Startup</option>
              <option value="mid-market">Mid-market</option>
              <option value="enterprise">Enterprise</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="region">Region</label>
            <select id="region" class="input select">
              <option value="">Any</option>
              <option value="NA">NA</option>
              <option value="EMEA">EMEA</option>
              <option value="APAC">APAC</option>
              <option value="LATAM">LATAM</option>
              <option value="Global">Global</option>
            </select>
          </div>
        </div>

        <div class="field" id="kpiField" hidden>
          <label class="label">KPIs They Care About</label>
          <p class="hint">Select the metrics most important to this customer</p>
          <div id="kpiGrid" class="kpi-grid"></div>
        </div>

        <div class="field" id="customKpiField" hidden>
          <label class="label" for="customKpiInput">Add Custom KPI</label>
          <div class="input-row">
            <input id="customKpiInput" class="input" type="text" placeholder="e.g. feature adoption">
            <button type="button" class="btn btn-outline" id="addCustomKpiBtn">Add</button>
          </div>
        </div>

        <div id="selectedKpis" class="tag-row"></div>

        <button type="submit" class="btn btn-primary" id="saveBtn">Save Profile</button>
      </form>
    </div>
  </section>

  <!-- ── Tab: Customers ────────────────────────────────────────────── -->
  <section class="pane" id="tab-customers">
    <div id="customerList"></div>
  </section>

  <!-- ── Tab: Story ────────────────────────────────────────────────── -->
  <section class="pane" id="tab-story">
    <div class="card">
      <h2 class="card-heading">Generate Story Arc</h2>
      <div class="field">
        <label class="label" for="storyCustomerSelect">Customer</label>
        <select id="storyCustomerSelect" class="input select">
          <option value="">Select customer…</option>
        </select>
      </div>
      <button class="btn btn-primary" id="generateBtn">Build Story Arc</button>
    </div>

    <div id="storyLoading" class="loading" hidden>
      <div class="spinner"></div>
      <p>Building your story arc…</p>
    </div>

    <div id="storyError" class="error-box" hidden></div>

    <div id="storyCard" class="card story-card" hidden>
      <div class="story-header">
        <h3 id="storyTitle"></h3>
        <div class="story-copy-btns">
          <button class="icon-btn" id="copyWABtn" title="Copy for WhatsApp">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </button>
          <button class="icon-btn" id="copyTextBtn" title="Copy plain text">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="storyBody"></div>
    </div>
  </section>

</div><!-- .app -->

<div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

<script src="app.js"></script>
</body>
</html>
